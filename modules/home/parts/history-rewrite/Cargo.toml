# =============================================================================
# history-rewrite: 履歴の中の崩れた語を辞書で直し、文書と本文のコミットの番号を commit-refs で付け直す CLI（ADR-0045、ADR-0088）
# =============================================================================
# 辞書は ja-terms のライブラリで当て、表の揃え直しは fix-markdown-lint のライブラリを呼ぶ。Windows でも cargo install で
# 入れ、PATH の git と commit-refs を呼ぶ。
# =============================================================================
[package]
name = "history-rewrite"
version = "0.1.0"
edition = "2024"

[dependencies]
# 辞書（prh.yml）を prh と同じ意味で全文に当てる（ADR-0085）
ja-terms = { path = "../ja-terms" }
# 直した Markdown の表を、run-checks の自動修正と同じ形に揃え直す
fix-markdown-lint = { path = "../fix-markdown-lint" }
# --exclude の glob を正規表現に直して照合する。fix-markdown-lint と同じ版
regex = "1"
