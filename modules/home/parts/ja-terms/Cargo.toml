# =============================================================================
# ja-terms: 崩れた日本語の語の辞書（prh.yml）を読み、prh 5.4.4（textlint-rule-prh 6.0.0 が使う版）と同じ意味で文に当てるライブラリ（ADR-0085）
# =============================================================================
# textlint（Node.js）と history-rewrite の prh_rules.py を置き換え、Windows と Linux で同じ判定にするためのもの。
# 呼ぶ所の付け替えは #101 で進める。
# =============================================================================
[package]
name = "ja-terms"
version = "0.1.0"
edition = "2024"

[dependencies]
# 辞書の pattern は JavaScript の正規表現（長さの決まらない後読みを含む）。ECMAScript のエンジンで書き直さずに読む
# utf16: prh:disable:<pattern> を、V8 の u のフラグの無い正規表現と同じく UTF-16 の単位で照合する
regress = { version = "0.12", features = ["utf16"] }
# Markdown のうち textlint の Str のノードに当たる原文を切り出す。Rust の CommonMark のパーサーとして事実上の標準
pulldown-cmark = { version = "0.13", default-features = false }
# 辞書の YAML。prh の js-yaml 3.14.1 と違い YAML 1.2 で読み、引用符の無い 1:30 を文字列と読む（js-yaml は 60 進の数と読み、
# prh が辞書を読まない）。辞書の値は引用符で囲む
yaml-rust2 = "0.13"
