# =============================================================================
# ja-terms: 崩れた日本語の語の辞書（prh.yml）を読み、prh 6.0.0 と同じ意味で文に当てるライブラリ（ADR-0085）
# =============================================================================
# textlint（Node.js）と history-rewrite の prh_rules.py を置き換え、Windows と Linux で同じ判定にする。
# =============================================================================
[package]
name = "ja-terms"
version = "0.1.0"
edition = "2024"

[dependencies]
# 辞書の pattern は JavaScript の正規表現（長さの決まらない後読みを含む）。ECMAScript のエンジンで書き直さずに読む
regress = "0.12"
# 辞書の YAML。prh の js-yaml と同じ YAML 1.2 で読む（1.1 では引用符の無い 1:30 や yes が別の型になる）
yaml-rust2 = "0.13"
