# Linux で Rust の crate のテストを流す。cfg(unix) のテスト（tests/git_spawn.rs の偽の squeue など）は Windows の CI で
# 流れず、nix flake check は重くて PR の前に飛ばしやすいので、PR の上で cargo test だけを流す（#180）。
# windows.yml と同じ形で、crate ごとの matrix にする
name: linux

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [design-records, claude-hooks, ja-terms, claude-setup, commit-refs, fix-markdown-lint, history-rewrite]
    defaults:
      run:
        working-directory: modules/home/parts/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      # history-rewrite の run は第 2 段で PATH の commit-refs を呼ぶ
      - if: matrix.crate == 'history-rewrite'
        run: cargo install --locked --path ../commit-refs
      - run: cargo test --locked

  # claude/tests の sh のテスト（hook の判定、スクリプト、スキルの文書の検査）。cargo test と違って流すゲートが無く、手で
  # 流さないと落ちたまま main に入っていた（#273）。hooks.sh と scripts.sh は claude-hooks を cargo build してから走る
  sh-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [hooks, scripts, skills]
    steps:
      - uses: actions/checkout@v5
      - run: bash claude/tests/${{ matrix.suite }}.sh
