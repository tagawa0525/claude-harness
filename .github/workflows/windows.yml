# ネイティブの Windows で Rust の crate のテストを流す（ADR-0083）。Linux のテストは linux.yml（cargo test と claude/tests の sh のテスト）と nix flake check が受け持つ。
# matrix には Windows で通る crate だけを入れ、ほかの crate は Windows に移す PR で通してから足す（#101）。
# setup のジョブは docs/windows.md（README の「Windows で使う」が指す）の手順の scripts/install-windows.sh を流し、入れた後を確かめる
name: windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [design-records, claude-hooks, ja-terms, claude-setup, commit-refs, fix-markdown-lint, history-rewrite]
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      # history-rewrite の run はステージ 2 で PATH の commit-refs を呼ぶ
      - if: matrix.crate == 'history-rewrite'
        run: cargo install --locked --path ../commit-refs
      - run: cargo test --locked
      # Unix だけのテスト（cfg(unix)）だけが使うヘルパーと import は、Windows のテストのビルドでだけ未使用の警告になる。
      # run-checks.sh と同じ clippy を流し、実機の Windows の run-checks.sh が失敗する前にここで止める
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Windows の claude-hooks は、環境変数の無いとき ja-terms を名前で起動する（#115。隣に無ければ PATH）。cargo install で入れた ja-terms と
      # 辞書で、git merge と git commit のメッセージを止めることを、Linux の install check と同じ sh のテストで確かめる。
      # 共通の辞書は、claude-setup sync の無いこのジョブでは、Linux の install check と同じくソースの辞書を環境変数で渡す（ADR-0097）
      - if: matrix.crate == 'claude-hooks'
        run: cargo install --locked --path ../ja-terms
      - if: matrix.crate == 'claude-hooks'
        shell: bash
        run: |
          # 環境変数の無いときの、PATH の ja-terms の経路を確かめる
          unset CLAUDE_HOOKS_JA_TERMS
          export JA_TERMS_COMMON_DICTIONARY="$PWD/../ja-terms/prh.yml"
          cargo build --locked
          bash tests/merge-ja-terms.sh target/debug/claude-hooks.exe
          bash tests/commit-message.sh target/debug/claude-hooks.exe

  # scripts/install-windows.sh を流し、settings.json に登録した PreToolUse hook が、main への git commit を
  # 止め、feature branch の git commit を gitleaks に通して許すことを確かめる（ADR-0084 の確認）
  setup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # docs/windows.md は winget で入れるが、runner には winget が無いので、リリースの zip を PATH に置く。SHA256 は
      # リリースの gitleaks_8.30.1_checksums.txt の値（2026-11-13 に取得）
      - shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw "gitleaks.zip の SHA256 が違います: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\gitleaks"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\gitleaks"
      - name: Follow docs/windows.md
        run: bash scripts/install-windows.sh
      # スキルの sh のスクリプトは、Linux と同じ "$HOME/.claude/bin/claude-hooks" で呼ぶ（ADR-0087）。Git Bash がこのパスに
      # .exe を補って起動することを、引数の足りない呼び出しの使い方の誤り（2）で確かめる（見つからなければ 127）
      - name: Check the paths the scripts and messages use
        run: |
          set -euo pipefail
          rc=0
          "$HOME/.claude/bin/claude-hooks" local-review-covers || rc=$?
          test "$rc" -eq 2
          # スキルと修正方法の文が名前で呼ぶコマンドは、scripts/install-windows.sh が ~/.bashrc で PATH に足す ~/.claude/bin のもの。CI の
          # step は ~/.bashrc を読まない（後の git hook の確認は、PATH に無い ja-terms を claude-hooks の隣で見つける）
          for name in claude-setup commit-refs ja-terms design-records; do
            found=$(bash -c 'source ~/.bashrc && command -v "$1"' _ "$name")
            test "$found" -ef "$HOME/.claude/bin/$name.exe"
          done
          if command -v ja-terms; then
            echo "ja-terms が CI の step の PATH にあり、隣の ja-terms の経路を確かめられません" >&2
            exit 1
          fi
      # 同期した sh のスクリプトは LF でないと Git Bash で動かない。runner の Git for Windows は core.autocrlf=true で、
      # checkout が CRLF にしうる（#104）。grep は Windows ではテキストのファイルの CR を外してから照合するので（-U の
      # 無いとき）使わず、tr で CR だけを残して wc で数える（数を出すので、$(...) が CR を落としても数は変わらない）。
      # 確かめ方そのものが CR を見つけることを、CRLF のファイルで毎回確かめてから調べる
      - name: Check the synced files use LF
        run: |
          set -euo pipefail
          # 数えられなければ（tr が読めない）止める。代入で受けるので、失敗が set -e に届く（[ ] の中の $(...) は届かない）
          crs() { tr -cd '\r' < "$1" | wc -c; }
          probe=$(mktemp)
          trap 'rm -f "$probe"' EXIT
          printf 'x\r\n' > "$probe"
          n=$(crs "$probe")
          if [ "$n" -eq 0 ]; then
            echo "CR を数える確かめ方が、CRLF のファイルの CR を見つけません"
            exit 1
          fi
          # && でつなぐと、最後以外の失敗は set -e に届かないので、1 つずつ確かめる
          test -d ~/.claude/scripts
          test -d ~/.claude/skills
          test -f ~/.claude/CLAUDE.md
          targets=(~/.claude/CLAUDE.md ~/.claude/scripts ~/.claude/skills)
          if [ -d ~/.claude/commands ]; then
            targets+=(~/.claude/commands)
          fi
          # プロセス置換の中の find の失敗は set -e に届かないので、ファイルに受けてから読む
          list=$(mktemp)
          trap 'rm -f "$probe" "$list"' EXIT
          find "${targets[@]}" -type f -print0 > "$list"
          crlf=""
          while IFS= read -r -d '' f; do
            n=$(crs "$f")
            if [ "$n" -ne 0 ]; then
              crlf+="$f"$'\n'
            fi
          done < "$list"
          if [ -n "$crlf" ]; then
            echo "CR を含む同期したファイル:"
            printf '%s' "$crlf"
            exit 1
          fi
      - name: Check the registered hook
        run: |
          set -euo pipefail
          command -v gitleaks
          hook=$(jq -r '.hooks.PreToolUse[].hooks[] | select(.args == ["pre-tool-use"]) | .command' ~/.claude/settings.json)
          test -f "$(cygpath -u "$hook")"
          repo=$(mktemp -d)
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          git -C "$repo" init -q -b main
          # スクリプトはグローバルの git hook も置く。ローカルの core.hooksPath で外し、git hook の無いリポジトリとして流す
          git -C "$repo" config core.hooksPath .git/hooks
          git -C "$repo" commit -q --allow-empty -m "chore: start"
          run() {
            jq -n --arg c "$1" --arg d "$(cygpath -w "$repo")" '{tool_name: "Bash", tool_input: {command: $c}, cwd: $d}' |
              "$(cygpath -u "$hook")" pre-tool-use
          }
          expect_deny() {
            local out
            out=$(run 'git commit -m "feat: add a"')
            echo "$out"
            [ "$(jq -r '.hookSpecificOutput.permissionDecision // empty' <<<"$out")" = deny ]
            jq -r '.hookSpecificOutput.permissionDecisionReason' <<<"$out" | grep -qF "$1"
          }
          expect_deny 'main / master ブランチへの直接コミット'
          git -C "$repo" switch -q -c feat/a
          echo a >"$repo/a"
          git -C "$repo" add a
          out=$(run 'git commit -m "feat: add a"')
          echo "$out"
          [ -z "$out" ]
          # gitleaks が実際に調べていることを、トークンらしき値で確かめる（値はその場で作り、ファイルに残さない）
          echo "token = \"ghp_$(openssl rand -hex 18)\"" >"$repo/b"
          git -C "$repo" add b
          expect_deny '機密情報らしき内容'
      # スクリプトが ~/.claude をリポジトリにした後に、登録した Stop の hook（claude-hooks stop）が自動メモリだけを
      # refs/memory-backup に退避することを確かめる（~/.claude の中の crate の記録や bin は、.gitignore で除外したまま残る）
      - name: Check the Stop hook
        run: |
          set -euo pipefail
          mkdir -p ~/.claude/projects/-ci/memory
          echo m >~/.claude/projects/-ci/memory/MEMORY.md
          echo '{}' >~/.claude/projects/-ci/session.jsonl
          test "$(jq '[.hooks.Stop[].hooks[]] | length' ~/.claude/settings.json)" -eq 1
          hook=$(jq -r '.hooks.Stop[].hooks[] | select(.args == ["stop"]) | .command' ~/.claude/settings.json)
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          echo '{"session_id":"ci","cwd":"/ci"}' | "$(cygpath -u "$hook")" stop
          test "$(git -C ~/.claude ls-tree -r --name-only refs/memory-backup)" = projects/-ci/memory/MEMORY.md
          # .gitignore が除外から外すのは、同期したものと自動メモリだけ（Claude Code の Grep が .gitignore に従うので、
          # これらは見えるようにする）。settings.json、bin、crate の記録、会話の記録は除外のまま
          test "$(git -C ~/.claude status --porcelain)" = "$(printf '?? %s\n' .gitignore CLAUDE.md projects/ scripts/ skills/)"
          test "$(git -C ~/.claude status --porcelain --untracked-files=all projects)" = '?? projects/-ci/memory/MEMORY.md'
      # 登録した UserPromptSubmit の hook（Git Bash の shell form。date と、単一引用符で括った Windows のパスの claude-hooks）が、
      # 初めてのプロンプトでは現在時刻の 1 行だけを出し、既定ブランチが進んだ後のプロンプトでは新しいコミットの件名も出す（#363）
      - name: Check the UserPromptSubmit hook
        run: |
          set -euo pipefail
          test "$(jq '[.hooks.UserPromptSubmit[].hooks[]] | length' ~/.claude/settings.json)" -eq 1
          cmd=$(jq -r '.hooks.UserPromptSubmit[].hooks[].command' ~/.claude/settings.json)
          echo "$cmd"
          repo=$(mktemp -d)
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          git -C "$repo" init -q -b main
          # スクリプトはグローバルの git hook も置く。ローカルの core.hooksPath で外す
          git -C "$repo" config core.hooksPath .git/hooks
          git -C "$repo" commit -q --allow-empty -m "chore: start"
          input=$(jq -n --arg d "$(cygpath -w "$repo")" '{session_id: "ci", cwd: $d}')
          out=$(bash -c "$cmd" <<<"$input")
          echo "$out"
          test "$(wc -l <<<"$out")" -eq 1
          grep -q '^現在時刻: ' <<<"$out"
          git -C "$repo" commit -q --allow-empty -m "Merge: from another session"
          out=$(bash -c "$cmd" <<<"$input")
          echo "$out"
          grep -qF 'Merge: from another session' <<<"$out"
      # スクリプトが置いた git hook が、Claude Code のセッションの main への直接のコミット、Conventional Commits でない件名、ステージ
      # したトークンを止め、feature branch の正しい件名のコミットを通す（ja-terms は PATH に無く claude-hooks の隣のもの、gitleaks は PATH のもの）
      - name: Check the git hooks
        run: |
          set -euo pipefail
          repo=$(mktemp -d)
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          git -C "$repo" init -q -b main
          git -C "$repo" commit -q --allow-empty -m "chore: start"
          echo a > "$repo/a"
          git -C "$repo" add a
          if CLAUDECODE=1 git -C "$repo" commit -q -m "feat: add a" 2> "$repo.err"; then
            echo "main への直接のコミットを pre-commit が止めなかった"
            exit 1
          fi
          cat "$repo.err"
          grep -qF "main / master ブランチへの直接コミット" "$repo.err"
          git -C "$repo" switch -q -c feat/a
          if CLAUDECODE=1 git -C "$repo" commit -q -m "add a" 2> "$repo.err"; then
            echo "Conventional Commits でない件名を commit-msg が止めなかった"
            exit 1
          fi
          cat "$repo.err"
          grep -qF "Conventional Commits" "$repo.err"
          CLAUDECODE=1 git -C "$repo" commit -q -m "feat: add a"
          git -C "$repo" log --oneline -1
          # トークンらしき値は、git の pre-commit の機密情報の検査が止める（値はその場で作り、ファイルに残さない）
          echo "token = \"ghp_$(openssl rand -hex 18)\"" > "$repo/b"
          git -C "$repo" add b
          if CLAUDECODE=1 git -C "$repo" commit -q -m "feat: add b" 2> "$repo.err"; then
            echo "ステージしたトークンを pre-commit が止めなかった"
            exit 1
          fi
          cat "$repo.err"
          grep -qF "機密情報らしき内容" "$repo.err"
      # スクリプトが置いたグローバルの attributes（ADR-0105）が配る中身と同じで、core.autocrlf=true（Git for Windows の既定。
      # runner の system の値が変わっても確かめるよう、一時のリポジトリに書く）のもとでも、.gitattributes の無いリポジトリの
      # テキストを LF で index に入れて LF で取り出し、*.bat を CRLF で取り出す
      - name: Check the global git attributes
        run: |
          set -euo pipefail
          cmp ~/.config/git/attributes config/git/attributes
          repo=$(mktemp -d)
          git -C "$repo" init -q -b main
          git -C "$repo" config core.autocrlf true
          printf 'x\r\ny\r\n' >"$repo/a.txt"
          printf 'echo\n' >"$repo/run.bat"
          git -C "$repo" add a.txt run.bat
          rm "$repo/a.txt" "$repo/run.bat"
          git -C "$repo" checkout -- a.txt run.bat
          eol=$(git -C "$repo" ls-files --eol a.txt run.bat)
          echo "$eol"
          test "$(grep -c '^i/lf ' <<<"$eol")" -eq 2
          grep -q '^i/lf *w/lf .*a\.txt$' <<<"$eol"
          grep -q '^i/lf *w/crlf .*run\.bat$' <<<"$eol"
