# ネイティブの Windows で Rust の crate のテストを流す（ADR-0083）。Linux のテストは nix flake check が受け持つ。
# matrix には Windows で通る crate だけを入れ、ほかの crate は Windows に移す PR で通してから足す（#101）。
# setup のジョブは README の「Windows で使う」の手順を流す（手順を変えたら、このジョブも合わせる）
name: windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cargo-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [design-records, claude-hooks, ja-terms, claude-setup, commit-refs]
    defaults:
      run:
        working-directory: modules/home/parts/${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --locked
      # Windows の claude-hooks は、環境変数の無いとき PATH の ja-terms を呼ぶ（#115）。cargo install で入れた ja-terms と
      # 辞書で、git merge と git commit のメッセージを止めることを、Linux の install check と同じ sh のテストで確かめる
      - if: matrix.crate == 'claude-hooks'
        run: cargo install --locked --path ../ja-terms
      - if: matrix.crate == 'claude-hooks'
        shell: bash
        run: |
          # 環境変数の無いときの、PATH の ja-terms の経路を確かめる
          unset CLAUDE_HOOKS_JA_TERMS
          cargo build --locked
          bash tests/merge-ja-terms.sh target/debug/claude-hooks.exe
          bash tests/commit-message.sh target/debug/claude-hooks.exe

  # README の「Windows で使う」の手順を流し、settings.json に登録した PreToolUse hook が、main への git commit を
  # 止め、feature branch の git commit を gitleaks に通して許すことを確かめる（ADR-0084 の確認）
  setup:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      # README は winget で入れるが、runner には winget が無いので、リリースの zip を PATH に置く。SHA256 は
      # リリースの gitleaks_8.30.1_checksums.txt の値（2026-11-13 に取得）
      - shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\gitleaks.zip"
          Invoke-WebRequest -Uri https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw "gitleaks.zip の SHA256 が違います: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\gitleaks"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\gitleaks"
      - name: Follow the README
        run: |
          for crate in claude-hooks ja-terms commit-refs claude-setup; do
            cargo install --locked --force --path "modules/home/parts/$crate"
          done
          claude-setup sync "$PWD"
          claude-setup settings --static modules/home/parts/claude-settings.json \
            --pre-tool-use "$(cygpath -w "$(command -v claude-hooks.exe)")"
      # 同期した sh のスクリプトは LF でないと Git Bash で動かない。runner の Git for Windows は core.autocrlf=true で、
      # checkout が CRLF にしうる（#104）。grep は Windows ではテキストのファイルの CR を外してから照合するので（-U の
      # 無いとき）使わず、tr で CR だけを残して wc で数える（数を出すので、$(...) が CR を落としても数は変わらない）。
      # 確かめ方そのものが CR を見つけることを、CRLF のファイルで毎回確かめてから調べる
      - name: Check the synced files use LF
        run: |
          set -euo pipefail
          crs() { tr -cd '\r' < "$1" | wc -c; }
          probe=$(mktemp)
          printf 'x\r\n' > "$probe"
          if [ "$(crs "$probe")" -eq 0 ]; then
            echo "CR を数える確かめ方が、CRLF のファイルの CR を見つけません"
            exit 1
          fi
          rm -f "$probe"
          test -d ~/.claude/scripts && test -d ~/.claude/skills && test -f ~/.claude/CLAUDE.md
          targets=(~/.claude/CLAUDE.md ~/.claude/scripts ~/.claude/skills)
          if [ -d ~/.claude/commands ]; then
            targets+=(~/.claude/commands)
          fi
          crlf=""
          while IFS= read -r -d '' f; do
            if [ "$(crs "$f")" -ne 0 ]; then
              crlf+="$f"$'\n'
            fi
          done < <(find "${targets[@]}" -type f -print0)
          if [ -n "$crlf" ]; then
            echo "CR を含む同期したファイル:"
            printf '%s' "$crlf"
            exit 1
          fi
      - name: Check the registered hook
        run: |
          set -euo pipefail
          command -v gitleaks
          hook=$(jq -r '.hooks.PreToolUse[].hooks[] | select(.args == ["pre-tool-use"]) | .command' ~/.claude/settings.json)
          test -f "$(cygpath -u "$hook")"
          repo=$(mktemp -d)
          export GIT_AUTHOR_NAME=ci GIT_AUTHOR_EMAIL=ci@example.com GIT_COMMITTER_NAME=ci GIT_COMMITTER_EMAIL=ci@example.com
          git -C "$repo" init -q -b main
          git -C "$repo" commit -q --allow-empty -m "chore: start"
          run() {
            jq -n --arg c "$1" --arg d "$(cygpath -w "$repo")" '{tool_name: "Bash", tool_input: {command: $c}, cwd: $d}' |
              "$(cygpath -u "$hook")" pre-tool-use
          }
          expect_deny() {
            local out
            out=$(run 'git commit -m "feat: add a"')
            echo "$out"
            [ "$(jq -r '.hookSpecificOutput.permissionDecision // empty' <<<"$out")" = deny ]
            jq -r '.hookSpecificOutput.permissionDecisionReason' <<<"$out" | grep -qF "$1"
          }
          expect_deny 'main / master ブランチへの直接コミット'
          git -C "$repo" switch -q -c feat/a
          echo a >"$repo/a"
          git -C "$repo" add a
          out=$(run 'git commit -m "feat: add a"')
          echo "$out"
          [ -z "$out" ]
          # gitleaks が実際に調べていることを、トークンらしき値で確かめる（値はその場で作り、ファイルに残さない）
          echo "token = \"ghp_$(openssl rand -hex 18)\"" >"$repo/b"
          git -C "$repo" add b
          expect_deny '機密情報らしき内容'
